<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bite by FNAF - Ultimate Edition</title>
    <style>
        :root {
            --red: #a00000;
            --dark: #050505;
            --green: #00aa00;
            --blue: #0055aa;
            --gray: #333333;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--dark); color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        /* --- UI ЛОБІ ТА МЕНЮ --- */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%); z-index: 20;
        }
        .menu-box {
            background: rgba(10, 10, 10, 0.95); border: 2px solid #441111;
            padding: 30px; border-radius: 8px; width: 90%; max-width: 450px;
            box-shadow: 0 0 40px rgba(150, 0, 0, 0.4); text-align: center;
        }
        h1 { color: var(--red); font-size: 2.3rem; text-shadow: 2px 2px 0 #000; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        h2 { font-size: 0.95rem; color: #888; margin-bottom: 25px; letter-spacing: 1px; }

        .btn {
            width: 100%; padding: 15px; margin: 8px 0; background: #4a0000;
            color: white; border: 1px solid #ff3333; font-size: 1.1rem;
            font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s;
            border-radius: 4px;
        }
        .btn:hover { background: var(--red); box-shadow: 0 0 15px red; }
        .btn:disabled { background: #222; border-color: #444; color: #666; cursor: not-allowed; box-shadow: none; }
        
        .input-field {
            width: calc(100% - 30px); padding: 15px; margin: 8px 0;
            background: #111; color: #fff; border: 1px solid #555;
            font-size: 1.2rem; text-align: center; letter-spacing: 2px; text-transform: uppercase;
            border-radius: 4px;
        }

        .player-list { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; margin: 15px 0; text-align: left; min-height: 50px; }
        .player-item { padding: 5px; border-bottom: 1px solid #333; display: flex; align-items: center; }
        .player-item::before { content: '👁️'; margin-right: 10px; color: var(--red); }

        .room-code-box {
            background: #000; border: 1px dashed var(--red); padding: 15px;
            margin: 15px 0; cursor: pointer; font-size: 1.2rem; letter-spacing: 3px;
            border-radius: 4px;
        }
        .room-code-box:hover { background: #110000; }

        /* --- ІГРОВИЙ HUD --- */
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; z-index: 1; }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; z-index: 10;
        }
        .hud-panel { position: absolute; padding: 20px; text-shadow: 2px 2px 4px #000; }
        #hud-bl { bottom: 20px; left: 20px; }
        #hud-br { bottom: 20px; right: 20px; text-align: right; }
        #hud-tc { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }

        .hud-label { font-size: 13px; color: #ccc; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .bar-bg { width: 220px; height: 14px; background: #111; border: 2px solid #555; margin-bottom: 15px; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.1s; }
        
        #bar-hp { background: var(--red); }
        #bar-stamina { background: var(--blue); }
        #bar-battery { background: #ddaa00; }
        
        #role-text { font-size: 24px; font-weight: bold; color: #fff; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        #ability-text { font-size: 13px; color: #bbb; }
        #cooldown-text { font-size: 14px; color: #ffaa00; font-weight: bold; margin-top: 5px; }

        #gen-text { font-size: 28px; font-weight: bold; color: #fff; letter-spacing: 2px; }
        #alert-text { font-size: 18px; color: #ff3333; font-weight: bold; margin-top: 10px; text-transform: uppercase; text-shadow: 0 0 10px red; }
        #recharge-icon { display: none; color: #ddaa00; font-size: 18px; font-weight: bold; animation: pulse 1s infinite; }

        @viewport { width: device-width; zoom: 1.0; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        /* --- СКРІМЕР ТА ЕФЕКТИ --- */
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; background: white; border-radius: 50%; z-index: 5; pointer-events: none; display: none;
        }

        #jumpscare-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 999; display: none;
            justify-content: center; align-items: center; flex-direction: column;
            overflow: hidden;
        }
        #jumpscare-screen.shaking {
            animation: extremeScreenShake 0.05s infinite;
        }
        .scare-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            animation: flashColor 0.06s infinite alternate; opacity: 0.95;
        }
        
        #scare-face {
            width: 80vmin; height: 80vmin; 
            background: radial-gradient(circle, #4a0e0e 30%, #1a0202 90%);
            border: 4px solid #111;
            border-radius: 40% 40% 20% 20%;
            position: relative;
            animation: violentShake 0.03s infinite alternate, zoomFace 1.5s ease-in-out infinite alternate;
            z-index: 1000; box-shadow: 0 0 100px #ff0000;
        }
        #scare-face::before, #scare-face::after {
            content: ''; position: absolute;
            width: 22%; height: 22%; background: #000; border-radius: 50%;
            top: 25%; box-shadow: inset 0 0 20px #000, 0 0 40px #ff0000;
            background-image: radial-gradient(circle, #ff0000 30%, #330000 70%, #000 100%);
            animation: eyePulse 0.08s infinite alternate;
        }
        #scare-face::before { left: 18%; }
        #scare-face::after { right: 18%; }

        .scare-ear-l, .scare-ear-r {
            position: absolute; width: 15%; height: 35%; background: #3a0000;
            border-radius: 50% 50% 10% 10%; top: -15%; z-index: -1;
            border: 2px solid #111;
        }
        .scare-ear-l { left: 10%; transform: rotate(-15deg); }
        .scare-ear-r { right: 10%; transform: rotate(15deg); }
        
        .scare-jaw {
            position: absolute; bottom: 8%; left: 10%; width: 80%; height: 35%;
            background: #050505; border-radius: 20px;
            border: 3px solid #222;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 5px 0;
            box-shadow: inset 0 0 30px #000;
        }
        .teeth-row {
            display: flex; justify-content: space-around; width: 100%; height: 40%;
        }
        .teeth-row.bottom {
            transform: scaleY(-1);
        }
        .tooth { 
            width: 8%; height: 100%; background: #f0f0f0; 
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            filter: drop-shadow(0px 2px 2px rgba(255,0,0,0.5));
        }
        
        @keyframes flashColor {
            0% { background-color: #ff0000; }
            33% { background-color: #ffffff; }
            66% { background-color: #000000; }
            100% { background-color: #ff0000; }
        }
        @keyframes extremeScreenShake {
            0% { transform: translate(15px, 15px) rotate(2deg); }
            10% { transform: translate(-15px, -12px) rotate(-3deg); }
            20% { transform: translate(-20px, 0px) rotate(4deg); }
            30% { transform: translate(0px, 18px) rotate(0deg); }
            40% { transform: translate(18px, -18px) rotate(3deg); }
            50% { transform: translate(-12px, 15px) rotate(-2deg); }
            60% { transform: translate(-18px, 18px) rotate(1deg); }
            70% { transform: translate(15px, 10px) rotate(-4deg); }
            80% { transform: translate(-10px, -15px) rotate(2deg); }
            90% { transform: translate(18px, 12px) rotate(-1deg); }
            100% { transform: translate(-12px, -10px) rotate(3deg); }
        }
        @keyframes violentShake {
            0% { transform: translate(15px, -10px) rotate(-4deg); }
            50% { transform: translate(-10px, 15px) rotate(5deg); }
            100% { transform: translate(12px, 12px) rotate(-3deg); }
        }
        @keyframes eyePulse {
            0% { transform: scale(0.85); filter: brightness(0.9); }
            100% { transform: scale(1.35); filter: brightness(2.0); }
        }
        @keyframes zoomFace { 0% { transform: scale(0.8); } 100% { transform: scale(1.5); } }

        /* --- ТАЧ УПРАВЛІННЯ --- */
        #touch-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; display: none; }
        #touch-left { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; }
        .joy-bg { width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
        .joy-stick { width: 60px; height: 60px; background: rgba(255,0,0,0.5); border-radius: 50%; position: absolute; top: 45px; left: 45px; }
        
        #touch-actions { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; }
        .t-btn { width: 75px; height: 75px; background: rgba(10,10,10,0.85); border: 2px solid white; border-radius: 50%; color: white; font-weight: bold; font-size: 11px; display: flex; justify-content: center; align-items: center; touch-action: none; }
        .t-btn:active { background: var(--red); }
    </style>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="panel-menu" class="menu-box">
            <h1>Bite by FNAF</h1>
            <h2>Labyrinth of Horrors</h2>
            
            <div style="background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #333;">
                <h3 style="margin: 0 0 10px 0; font-size: 1rem; color: #aaa;">Одиночна гра (Проти бота)</h3>
                <div style="display: flex; gap: 5px;">
                    <button class="btn" style="padding: 10px; font-size: 0.85rem;" onclick="app.startSingleplayer(1)">Легко</button>
                    <button class="btn" style="padding: 10px; font-size: 0.85rem; background: #663300;" onclick="app.startSingleplayer(2)">Норм</button>
                    <button class="btn" style="padding: 10px; font-size: 0.85rem; background: #880000;" onclick="app.startSingleplayer(3)">Хард</button>
                    <button class="btn" style="padding: 10px; font-size: 0.85rem; background: #220000; color: #ff3333; border-color: #ff0000; text-shadow: 0 0 5px red;" onclick="app.startSingleplayer(4)">ЖАХ</button>
                </div>
            </div>

            <hr style="border:0; border-top:1px solid #333; margin: 25px 0;">
            <button class="btn" onclick="app.createRoom()">Створити кімнату</button>
            <input type="text" id="join-input" class="input-field" placeholder="Введіть 4 символи ID" maxlength="4">
            <button class="btn" style="background:#005500; border-color:#00aa00;" onclick="app.joinRoom()">Приєднатися</button>
        </div>

        <div id="panel-lobby" class="menu-box" style="display:none;">
            <h1>Кімната</h1>
            <div id="room-code-display" class="room-code-box" onclick="app.copyCode()" style="display:none;">
                ID Кімнати: <strong id="lobby-id" style="color:var(--red);">----</strong>
                <br><span style="font-size:12px; color:#888;">(Натисніть щоб скопіювати)</span>
            </div>
            <div class="player-list" id="lobby-players"></div>
            <button id="btn-start-multi" class="btn" style="display:none;" onclick="app.startMultiplayer()">Почати Гру</button>
            <button class="btn" style="background:#222; border-color:#444;" onclick="location.reload()">Вийти</button>
        </div>
    </div>

    <div id="game-container"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div id="hud-bl" class="hud-panel">
            <div class="hud-label">Життя (HP)</div>
            <div class="bar-bg"><div id="bar-hp" class="bar-fill" style="width:100%;"></div></div>
            <div class="hud-label">Витривалість</div>
            <div class="bar-bg"><div id="bar-stamina" class="bar-fill" style="width:100%;"></div></div>
        </div>
        
        <div id="hud-br" class="hud-panel">
            <div class="hud-label">Батарея Ліхтарика</div>
            <div class="bar-bg" style="float:right;"><div id="bar-battery" class="bar-fill" style="width:100%;"></div></div>
            <div style="clear:both;"></div>
            <div id="recharge-icon">⚡ ЗАРЯДЖАННЯ В ОФІСІ...</div>
            <div style="margin-top: 20px;">
                <div id="role-text">Спектатор</div>
                <div id="ability-text">Дія: [E] / Tap</div>
                <div id="cooldown-text"></div>
            </div>
        </div>

        <div id="hud-tc" class="hud-panel">

    </div>

    <div id="touch-ui">

        <div class="scare-flash"></div>
        <div id="scare-face">
            <div class="scare-ear-l"></div>
            <div class="scare-ear-r"></div>
            <div class="scare-jaw">
                <div class="teeth-row top">
                    <div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div>
                </div>
                <div class="teeth-row bottom">
                    <div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div><div class="tooth"></div>
                </div>
            </div>
        </div>
        <div id="jumpscare-text">ВАС СПІЙМАЛИ</div>
    </div>

    <script>
        /**
         * АУДІО ДВИЖОК (Web Audio API & Custom Files)
         */
        class AudioEngine {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            playSynth(type, freqStart, freqEnd, duration, vol) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
                    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
                    
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + duration);
                    
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playClick() { this.playSynth('sine', 600, 100, 0.1, 0.1); }
            playRepair() { this.playSynth('square', 300, 600, 0.3, 0.05); }
            playGenDone() { this.playSynth('sine', 400, 800, 0.6, 0.2); }
            playTaser() { this.playSynth('sawtooth', 100, 800, 0.4, 0.15); }
            playHeal() { this.playSynth('sine', 300, 900, 0.5, 0.15); }
            playDoor() { this.playSynth('square', 100, 50, 0.5, 0.3); }
            playMonsterHit() { this.playSynth('triangle', 80, 20, 0.4, 0.5); }
            playFlicker() { this.playSynth('triangle', 120, 30, 0.05, 0.08); }
            playStep(deep) { this.playSynth('triangle', deep ? 60 : 120, 10, 0.12, deep ? 0.35 : 0.15); }
            
            playSpookyLaugh() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.1);
                    osc.frequency.linearRampToValueAtTime(600, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(now + 0.3);
                } catch(e) {
                    console.error("Doll audio failed", e);
                }
            }
            
            playJumpscare() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    const bufferSize = this.ctx.sampleRate * 2;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 1.0);
                    
                    noise.connect(gain); gain.connect(this.ctx.destination);
                    noise.start(); noise.stop(now + 1.0);
                } catch(e) {
                    console.error("Jumpscare audio failed", e);
                }
            }
        }
        const sfx = new AudioEngine();

        const app = {
            mode: 'menu', 
            isMobile: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
            difficulty: 1, 
            jumpscareActive: false, 
            
            peer: null, conn: null, myId: null,
            playersList: [],
            
            scene: null, camera: null, renderer: null, clock: new THREE.Clock(),
            walls: [], vents: [], generators: [], officeDoors: [], exitGate: null, flickeringLamps: [],
            spookyDolls: [],
            monsterSpawnPos: null,
            
            player: {
                mesh: null, role: 'Survivor', hp: 100, stamina: 100, battery: 60,
                speed: 5.5, jumpForce: 8, yVelocity: 0, isGrounded: true,
                cooldown: 0, isHidden: false, currentVentIdx: -1, height: 1.6,
                stepTimer: 0
            },
            
            monster: {
                mesh: null, speed: 6.0, state: 'idle', stunTimer: 0, stepTimer: 0
            },
            
            remotePlayers: {},
            fixedGenerators: 0,
            escapeOpen: false,

            keys: { w:false, a:false, s:false, d:false, shift:false, space:false, e_pressed:false },
            touch: { joyActive: false, origin:{x:0,y:0}, delta:{x:0,y:0}, lookId: null, lastLook:{x:0,y:0} }
        };

        function createSafePeer(id) {
            try {
                if (window.location.hostname.includes('usercontent') || window.location.protocol === 'data:') {
                    return null; 
                }
                return new Peer(id);
            } catch(e) {
                return null;
            }
        }

        function genShortId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let res = '';
            for(let i=0; i<4; i++) res += chars.charAt(Math.floor(Math.random() * chars.length));
            return res;
        }

        app.showPanel = function(id) {
            document.getElementById('panel-menu').style.display = 'none';
            document.getElementById('panel-lobby').style.display = 'none';
            document.getElementById(id).style.display = 'block';
        }

        app.updateLobbyUI = function() {
            const list = document.getElementById('lobby-players');
            list.innerHTML = '';
            app.playersList.forEach(p => {
                list.innerHTML += `<div class="player-item">${p.name} ${p.id === app.myId ? '(Ви)' : ''}</div>`;
            });
        }

        app.startSingleplayer = function(diff) {
            sfx.playClick();
            app.mode = 'single';
            app.difficulty = diff || 1;
            
            const survivorRoles = ['Medic', 'Hunter', 'Engineer'];
            app.player.role = survivorRoles[Math.floor(Math.random() * survivorRoles.length)];
            
            document.getElementById('ui-layer').style.display = 'none';
            initGame();
        }

        app.createRoom = function() {
            sfx.playClick();
            app.mode = 'host';
            app.myId = genShortId();
            
            app.peer = createSafePeer(app.myId);
            
            if (!app.peer) {
                document.getElementById('lobby-id').innerText = app.myId;
                document.getElementById('room-code-display').style.display = 'block';
                app.playersList = [{ id: app.myId, name: 'Хост' }];
                app.updateLobbyUI();
                app.showPanel('panel-lobby');
                
                setTimeout(() => {
                    app.playersList.push({ id: 'bot_guest', name: 'Гравець 2' });
                    app.updateLobbyUI();
                    document.getElementById('btn-start-multi').style.display = 'block';
                    app.conn = { send: function(){} }; 
                }, 1500);
                return;
            }

            app.peer.on('open', id => {
                document.getElementById('lobby-id').innerText = id;
                document.getElementById('room-code-display').style.display = 'block';
                app.playersList = [{ id: id, name: 'Хост' }];
                app.updateLobbyUI();
                app.showPanel('panel-lobby');
            });

            app.peer.on('connection', conn => {
                if (app.conn) return; 
                app.conn = conn;
                app.playersList.push({ id: conn.peer, name: 'Гравець 2' });
                app.updateLobbyUI();
                document.getElementById('btn-start-multi').style.display = 'block';
                
                app.conn.on('data', handleNetworkData);
                app.conn.send({ type: 'lobby_sync', players: app.playersList });
            });
        }

        app.joinRoom = function() {
            sfx.playClick();
            const id = document.getElementById('join-input').value.toUpperCase().trim();
            if(id.length !== 4) return showAlert("ID має містити 4 символи!");
            
            app.mode = 'client';
            app.peer = createSafePeer();
            
            if (!app.peer) {
                app.myId = genShortId();
                app.showPanel('panel-lobby');
                app.playersList = [{ id: 'host', name: 'Хост' }, { id: app.myId, name: 'Ви' }];
                app.updateLobbyUI();
                
                setTimeout(() => {
                    app.player.role = 'Engineer';
                    document.getElementById('ui-layer').style.display = 'none';
                    initGame();
                    spawnBotMonster(); 
                }, 2500);
                return;
            }

            app.peer.on('open', myId => {
                app.myId = myId;
                app.conn = app.peer.connect(id);
                app.conn.on('open', () => { app.showPanel('panel-lobby'); });
                app.conn.on('data', handleNetworkData);
            });
            app.peer.on('error', err => showAlert("Помилка: Невірний ID або кімната закрита."));
        }

        app.copyCode = function() {
            const id = document.getElementById('lobby-id').innerText;
            const temp = document.createElement('input');
            temp.value = id; document.body.appendChild(temp);
            temp.select(); document.execCommand('copy');
            document.body.removeChild(temp);
            showAlert("Код " + id + " скопійовано!");
        }

        app.startMultiplayer = function() {
            sfx.playClick();
            
            // ГАРАНТОВАНО РОЗДІЛЯЄМО РОЛІ: один обов'язково монстр, інший - виживший
            const survivors = ['Engineer', 'Hunter', 'Medic'];
            const p1IsMonster = Math.random() > 0.5;
            
            let p1Role, p2Role;
            if (p1IsMonster) {
                p1Role = 'Animatronic';
                p2Role = survivors[Math.floor(Math.random() * survivors.length)];
            } else {
                p2Role = 'Animatronic';
                p1Role = survivors[Math.floor(Math.random() * survivors.length)];
            }
            
            app.player.role = p1Role;
            if(app.conn && typeof app.conn.send === 'function') app.conn.send({ type: 'start', role: p2Role });
            
            document.getElementById('ui-layer').style.display = 'none';
            initGame();

            if (!app.peer) {
                setTimeout(() => spawnBotMonster(), 500);
            }
        }

        function handleNetworkData(data) {
            if (data.type === 'lobby_sync') {
                app.playersList = data.players;
                app.updateLobbyUI();
            }
            else if (data.type === 'start') {
                app.player.role = data.role;
                document.getElementById('ui-layer').style.display = 'none';
                initGame();
            }
            else if (data.type === 'update') {
                if(!app.remotePlayers[data.id]) createRemotePlayer(data.id, data.role);
                const rp = app.remotePlayers[data.id];
                rp.targetPos = new THREE.Vector3(data.x, data.y, data.z);
                rp.targetRot = data.ry;
                rp.isHidden = data.hidden;
            }
            else if (data.type === 'gen_fix') {
                app.generators[data.index].fixProgress = data.progress;
                if(data.progress >= 100 && !app.generators[data.index].fixed) fixGenerator(data.index);
            }
            else if (data.type === 'door_toggle') {
                toggleOfficeDoors(data.state);
            }
            else if (data.type === 'monster_stun') {
                app.monster.stunTimer = 3.0;
                sfx.playTaser();
            }
            else if (data.type === 'hit_player') {
                if(app.myId === data.target && app.player.hp > 0) {
                     app.player.hp -= 50; 
                     showAlert("ВАС ВДАРИЛИ!");
                     sfx.playMonsterHit(); 
                     if(app.player.hp <= 0) executeJumpscare();
                }
            }
            else if (data.type === 'jumpscare') {
                executeJumpscare();
            }
        }

        function broadcastState() {
            if(!app.conn || typeof app.conn.send !== 'function') return;
            app.conn.send({
                type: 'update', id: app.myId, role: app.player.role,
                x: app.camera.position.x, y: app.camera.position.y, z: app.camera.position.z,
                ry: app.camera.rotation.y, hidden: app.player.isHidden
            });
        }

        function buildMap() {
            const mapSize = 23;
            const cellSize = 5;
            const wallH = 5;

            const matFloor = new THREE.MeshPhongMaterial({ color: 0x18181a, shininess: 10 });
            const matCeil = new THREE.MeshPhongMaterial({ color: 0x0a0a0a, shininess: 2 });
            const matWall = new THREE.MeshPhongMaterial({ color: 0x241717, shininess: 5 }); 
            const matOffice = new THREE.MeshPhongMaterial({ color: 0x283344, shininess: 20 });

            const planeGeo = new THREE.PlaneGeometry(mapSize * cellSize, mapSize * cellSize);
            const floor = new THREE.Mesh(planeGeo, matFloor);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            app.scene.add(floor);

            const ceil = new THREE.Mesh(planeGeo, matCeil);
            ceil.rotation.x = Math.PI / 2;
            ceil.position.y = wallH;
            app.scene.add(ceil);

            const wallGeo = new THREE.BoxGeometry(cellSize, wallH, cellSize);
            let genCount = 0;
            
            let safeMonsterSpawnPoints = [];

            for(let z = 0; z < mapSize; z++) {
                for(let x = 0; x < mapSize; x++) {
                    const wx = (x - Math.floor(mapSize / 2)) * cellSize;
                    const wz = (z - Math.floor(mapSize / 2)) * cellSize;

                    if(x === 0 || z === 0 || x === mapSize - 1 || z === mapSize - 1) {
                        if (x === Math.floor(mapSize / 2) && z === 0) {
                            createExitGate(wx, wz, cellSize, wallH); 
                        } else {
                            createWall(wx, wz, wallGeo, matWall);
                        }
                        continue;
                    }

                    const cx = Math.abs(x - Math.floor(mapSize / 2));
                    const cz = Math.abs(z - Math.floor(mapSize / 2));

                    if (cx <= 2 && cz <= 2) {
                        const offFloor = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, cellSize), matOffice);
                        offFloor.rotation.x = -Math.PI / 2;
                        offFloor.position.set(wx, 0.01, wz);
                        app.scene.add(offFloor);

                        if (cx === 0 && cz === 0) {
                            createOfficeDesk(wx, wz - 1.2); 
                        }

                        if (cx === 2 || cz === 2) {
                            if ((x === Math.floor(mapSize/2) && z === Math.floor(mapSize/2) + 2) || 
                                (x === Math.floor(mapSize/2) && z === Math.floor(mapSize/2) - 2)) {
                                createOfficeDoor(wx, wz, cellSize, wallH);
                            } else {
                                createWall(wx, wz, wallGeo, matWall);
                            }
                        }
                        continue;
                    }

                    if (cx > 5 && cz > 5) {
                        safeMonsterSpawnPoints.push(new THREE.Vector3(wx, 0, wz)); // висота 0 для правильного рівня ніг
                    }

                    if ((x % 4 === 0 && z % 4 === 0) || (x % 3 === 0 && z % 5 === 0)) {
                        createWall(wx, wz, wallGeo, matWall);
                        if (Math.random() > 0.5) createProceduralProp(wx + 1.5, wz + 1.5);
                    } 
                    else if (cx > 3 && cz > 3 && Math.random() > 0.93 && app.vents.length < 5) {
                        createVent(wx, wz, cellSize);
                    } 
                    else if (Math.random() > 0.95 && genCount < 10) {
                        createGenerator(wx, wz);
                        genCount++;
                    }
                    
                    if (x % 5 === 0 && z % 5 === 0 && Math.random() > 0.4) {
                        createFlickeringLamp(wx, wallH - 0.2, wz);
                    }
                }
            }

            while(genCount < 10) {
                const rx = (Math.floor(Math.random() * (mapSize - 4)) + 2 - Math.floor(mapSize/2)) * cellSize;
                const rz = (Math.floor(Math.random() * (mapSize - 4)) + 2 - Math.floor(mapSize/2)) * cellSize;
                if (Math.abs(rx) > 15 || Math.abs(rz) > 15) { 
                    createGenerator(rx, rz);
                    genCount++;
                }
            }

            createVent(0, 0, cellSize);

            if (safeMonsterSpawnPoints.length > 0) {
                app.monsterSpawnPos = safeMonsterSpawnPoints[Math.floor(Math.random() * safeMonsterSpawnPoints.length)];
            } else {
                app.monsterSpawnPos = new THREE.Vector3(40, 0, 40);
            }

            createSpookyDoll(0, -8);     
            createSpookyDoll(-20, 15);   
            createSpookyDoll(20, -15);   
        }

            app.scene.add(mesh);
            mesh.geometry.computeBoundingBox();
            const box = new THREE.Box3().setFromObject(mesh);
            app.walls.push(box);
        }

        function createProceduralProp(x, z) {

            if (chance < 0.28) {
                createCrate(x, z); 
            } else if (chance < 0.55) {
                createMetalShelf(x, z); 
            } else if (chance < 0.78) {
                createSpookyChair(x, z); 
            } else {
                const group = new THREE.Group();
                const boxGeo = new THREE.BoxGeometry(1.6, 2.5, 1.6);
                const rustyMat = new THREE.MeshPhongMaterial({ color: 0x473939, shininess: 10 });
                const cabinet = new THREE.Mesh(boxGeo, rustyMat);
                cabinet.position.y = 1.25;
                group.add(cabinet);

                group.position.set(x, 0, z);
                app.scene.add(group);

                const box = new THREE.Box3().setFromObject(cabinet);
                app.walls.push(box);
            }
        }

        // ФУНКЦІЯ СТВОРЕННЯ ТЕКСТОВОГО НІКНЕЙМУ В 3D
        function createNameTag(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            if (ctx.roundRect) ctx.roundRect(10, 10, 492, 108, 15); else ctx.fillRect(10, 10, 492, 108);
            ctx.fill();
            
            ctx.strokeStyle = '#ff3333';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.font = 'Bold 30px Courier New';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, 256, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: true });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(3.2, 0.8, 1);
            return sprite;
        }

        function createRemotePlayer(id, role) {
            const isMonster = role === 'Animatronic';
            let mainGroup = new THREE.Group(); 
            
            if(isMonster) {
                const group = new THREE.Group();
                const mat = new THREE.MeshPhongMaterial({ color: 0x880000, shininess: 25 }); 
                const metalMat = new THREE.MeshPhongMaterial({ color: 0x1f1f1f, shininess: 80 }); 

                const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.5), metalMat);
                pelvis.position.y = 1.0;
                group.add(pelvis);

                const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5), metalMat);
                spine.position.set(0, 1.25, 0);
                group.add(spine);

                const chest = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.45, 1.0, 8), mat);
                chest.position.y = 1.8;
                chest.castShadow = true;
                group.add(chest);

                const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), mat);
                head.position.y = 2.6;
                group.add(head);

                const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.2, 0.5), mat);
                jaw.position.set(0, 2.15, 0.15);
                group.add(jaw);

                const teethMat = new THREE.MeshBasicMaterial({ color: 0xdddddd });
                for (let dx of [-0.2, 0, 0.2]) {
                    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.1, 4), teethMat);

        function setupInputs() {
            if (app.isMobile) {
                document.getElementById('touch-ui').style.display = 'block';
                document.getElementById('crosshair').style.display = 'none';
                setupTouch();
            } else {
                document.getElementById('touch-ui').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                
                const canvas = app.renderer.domElement;
                canvas.setAttribute('tabindex', '0'); 
                
                canvas.addEventListener('click', () => { 
                    canvas.focus(); 
                    if(app.player.hp > 0) canvas.requestPointerLock(); 
                });

                document.addEventListener('mousemove', (e) => {
                    if (document.pointerLockElement === canvas && app.player.hp > 0) {
                        app.camera.rotation.y -= e.movementX * 0.0022;
                        app.camera.rotation.x -= e.movementY * 0.0022;
                        app.camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, app.camera.rotation.x));
                    }
                });

                document.addEventListener('keydown', e => handleKey(e.code, true));
                document.addEventListener('keyup', e => handleKey(e.code, false));
            }
        }

        function setupTouch() {
            const touchLeft = document.getElementById('touch-left');
            const joyStick = document.getElementById('joy-stick');
            
            touchLeft.addEventListener('touchstart', (e) => {
                e.preventDefault();
                app.touch.joyActive = true;
                const touch = e.changedTouches[0];
                app.touch.origin = { x: touch.clientX, y: touch.clientY };
                joyStick.style.transform = `translate(0px, 0px)`;
            }, {passive: false});

            touchLeft.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!app.touch.joyActive) return;
                const touch = e.changedTouches[0];
                let dx = touch.clientX - app.touch.origin.x;
                let dy = touch.clientY - app.touch.origin.y;
                
                const maxDist = 40;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                
                joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
                app.touch.delta.x = dx / maxDist;
                app.touch.delta.y = dy / maxDist;
            }, {passive: false});

            touchLeft.addEventListener('touchend', (e) => {
                e.preventDefault();
                app.touch.joyActive = false;
                app.touch.delta = {x: 0, y: 0};
                joyStick.style.transform = `translate(0px, 0px)`;
            });

            document.addEventListener('touchstart', (e) => {
                if (e.target.closest('#touch-left') || e.target.closest('#touch-actions')) return;
                const touch = e.changedTouches[0];
                if (app.touch.lookId === null) {
                    app.touch.lookId = touch.identifier;
                    app.touch.lastLook = { x: touch.clientX, y: touch.clientY };
                }
            }, {passive: false});

            document.addEventListener('touchmove', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === app.touch.lookId && app.player.hp > 0) {
                        app.camera.rotation.y -= (touch.clientX - app.touch.lastLook.x) * 0.005;
                        app.camera.rotation.x -= (touch.clientY - app.touch.lastLook.y) * 0.005;
                        app.camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, app.camera.rotation.x));
                        app.touch.lastLook = { x: touch.clientX, y: touch.clientY };
                    }
                }
            }, {passive: false});

            document.addEventListener('touchend', (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === app.touch.lookId) {
                        app.touch.lookId = null;
                    }
                }
            });

            document.getElementById('btn-t-action').addEventListener('touchstart', (e) => {
                e.preventDefault();
                performAction();
            });

            document.getElementById('btn-t-jump').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (app.player.isGrounded && app.player.stamina > 20) {
                    app.player.yVelocity = app.player.jumpForce;
                    app.player.isGrounded = false;
                    app.player.stamina -= 22;
                }
            });

            const btnSprint = document.getElementById('btn-t-sprint');
            btnSprint.addEventListener('touchstart', (e) => {
                e.preventDefault();
                app.keys.shift = true;
                btnSprint.style.background = "rgba(0,150,255,0.8)";
            });
            btnSprint.addEventListener('touchend', (e) => {
                e.preventDefault();
                app.keys.shift = false;
                btnSprint.style.background = "rgba(0,50,150,0.8)";
            });
        }

        function handleKey(code, isDown) {
            if(app.player.hp <= 0) return;
            if (code === 'KeyW' || code === 'ArrowUp') app.keys.w = isDown;
            if (code === 'KeyS' || code === 'ArrowDown') app.keys.s = isDown;
            if (code === 'KeyA' || code === 'ArrowLeft') app.keys.a = isDown;
            if (code === 'KeyD' || code === 'ArrowRight') app.keys.d = isDown;
            if (code === 'ShiftLeft' || code === 'ShiftRight') app.keys.shift = isDown;
            
            if (code === 'Space' && isDown && app.player.isGrounded && app.player.stamina > 20) {
                app.player.yVelocity = app.player.jumpForce;
                app.player.isGrounded = false;
                app.player.stamina -= 22;
            }

            if (code === 'KeyE' && isDown && !app.keys.e_pressed) {
                app.keys.e_pressed = true;
                performAction();
            }
            if (code === 'KeyE' && !isDown) app.keys.e_pressed = false;
            
            if (code === 'KeyR' && isDown) {
                app.camera.position.set(0, app.player.height, 3.5); 
                showAlert("Позицію скинуто!");
            }
        }

        function performAction() {
            if(app.player.isHidden) {
                sfx.playClick();
                app.player.currentVentIdx = (app.player.currentVentIdx + 1) % app.vents.length;
                const nextVent = app.vents[app.player.currentVentIdx];
                app.camera.position.set(nextVent.x, -5, nextVent.z); 
                showAlert(`Переміщення вентиляцією...`);
                return;
            }

            const px = app.camera.position.x;
            const pz = app.camera.position.z;

            if (app.player.role === 'Animatronic') {
                if (app.player.cooldown > 0) return;
                
                sfx.playMonsterHit();
                let hitSomeone = false;

                for(let id in app.remotePlayers) {
                    const rp = app.remotePlayers[id];
                    if (rp.role !== 'Animatronic' && !rp.isHidden) {
                        if (app.camera.position.distanceTo(rp.mesh.position) < 3.8) {
                            hitSomeone = true;
                            if(app.conn && typeof app.conn.send === 'function') app.conn.send({ type: 'hit_player', target: id });
                        }
                    }
                }
                
                if (hitSomeone) {
                    showAlert("УДАР УСПІШНИЙ!");
                } else {
                    showAlert("ПРОМАХ!");
                }

                app.player.cooldown = 3.0; 
                return;
            }

            let acted = false;

            app.generators.forEach((gen, idx) => {
                if(!gen.fixed && Math.hypot(gen.x - px, gen.z - pz) < 4.5) {
                    gen.fixProgress += 15;
                    sfx.playRepair();
                    if(app.conn && typeof app.conn.send === 'function') app.conn.send({ type:'gen_fix', index: idx, progress: gen.fixProgress });
                    if(gen.fixProgress >= 100) fixGenerator(idx);
                    acted = true;
                }
            });

            if(acted) return;

            if (app.player.cooldown > 0) {
                showAlert("Здібність перезаряджається!"); return;
            }

            if (app.player.role === 'Engineer') {
                for(let i=0; i<app.vents.length; i++) {
                    const v = app.vents[i];
                    if(Math.hypot(v.x - px, v.z - pz) < 3) {
                        app.player.isHidden = true;
                        app.player.currentVentIdx = i;
                        app.camera.position.set(v.x, -5, v.z); 
                        app.player.cooldown = 60;
                        showAlert("ВИ В УБЕЖИЩІ ВЕНТИЛЯЦІЇ (20с)! [E] - наступна шахта");
                        
                        setTimeout(() => {
                            app.player.isHidden = false;
                            const currentVent = app.vents[app.player.currentVentIdx];
                            app.camera.position.set(currentVent.x, app.player.height, currentVent.z);
                            showAlert("Ви вийшли з вентиляційного люку.");
                        }, 20000);
                        return;
                    }
                }

                if(Math.hypot(px, pz) < 10) {
                    toggleOfficeDoors(1); 
                    app.player.cooldown = 20;
                    showAlert("Гермодвері Офісу заблоковано на 10с!");
                    if(app.conn && typeof app.conn.send === 'function') app.conn.send({type:'door_toggle', state: 1});
                    
                    setTimeout(() => { 
                        toggleOfficeDoors(0); 
                        if(app.conn && typeof app.conn.send === 'function') app.conn.send({type:'door_toggle', state: 0});
                    }, 10000);
                    return;
                }
            }

            if (app.player.role === 'Hunter') {
                sfx.playTaser();
                let monsterHit = false;
                
                if(app.remotePlayers['bot'] && app.camera.position.distanceTo(app.remotePlayers['bot'].mesh.position) < 6.0) {
                    app.monster.stunTimer = 3.0; monsterHit = true;
                } else {
                    for(let id in app.remotePlayers) {
                        if(app.remotePlayers[id].role === 'Animatronic' && app.camera.position.distanceTo(app.remotePlayers[id].mesh.position) < 6.0) {
                            if(app.conn && typeof app.conn.send === 'function') app.conn.send({ type: 'monster_stun' });
                            monsterHit = true;
                        }
                    }
                }

                if(monsterHit) showAlert("МОНСТРА ЕЛЕКТРОШОКОВАНО НА 3с!");
                else showAlert("Промах електрошокером!");
                app.player.cooldown = 20;
            }

            if (app.player.role === 'Medic') {
                if(app.player.hp < 100) {
                    app.player.hp = 100;
                    sfx.playHeal();
                    app.player.cooldown = 30;
                    showAlert("Медична аптечка успішно використана!");
                } else {
                    showAlert("Ваше здоров'я і так повне.");
                }
            }
        }

        function gameLoop() {
            const dt = Math.min(app.clock.getDelta(), 0.1);
            if(app.player.hp <= 0) return;

            if(!app.player.isHidden && (app.player.cooldown <= 0 || app.player.role !== 'Animatronic')) {
                updatePlayerPhysics(dt);
            }

            if ((app.mode === 'single' || !app.peer) && app.monster.state === 'hunting') {
                updateBotMonster(dt);
            }

            broadcastState();
            
            for(let id in app.remotePlayers) {
                const rp = app.remotePlayers[id];
                if (!rp.mesh) continue;
                rp.mesh.visible = !rp.isHidden;
                if(!rp.isHidden) {
                    if (id === 'bot' && (app.mode === 'single' || !app.peer)) {
                        if (rp.mesh.thighL) {
                            const animTime = app.clock.getElapsedTime() * app.monster.speed * 1.8;
                            rp.mesh.thighL.rotation.x = Math.sin(animTime) * 0.45;
                            rp.mesh.thighR.rotation.x = -Math.sin(animTime) * 0.45;
                            rp.mesh.upperArmL.rotation.x = -Math.sin(animTime) * 0.3;
                            rp.mesh.upperArmR.rotation.x = Math.sin(animTime) * 0.3;
                        }
                        continue; 
                    }
                    
                    // Вирівнюємо висоту мережевих гравців відносно рівня підлоги
                    let tPos = rp.targetPos.clone();
                    tPos.y = Math.max(0, tPos.y - 1.6); 
                    
                    rp.mesh.position.lerp(tPos, 15 * dt);
                    rp.mesh.rotation.y = rp.targetRot;

                    // Анімація кроків для віддаленого монстра-гравця
                    if (rp.role === 'Animatronic' && rp.mesh.thighL) {
                        const animTime = app.clock.getElapsedTime() * 8;
                        rp.mesh.thighL.rotation.x = Math.sin(animTime) * 0.45;
                        rp.mesh.thighR.rotation.x = -Math.sin(animTime) * 0.45;
                        rp.mesh.upperArmL.rotation.x = -Math.sin(animTime) * 0.3;
                        rp.mesh.upperArmR.rotation.x = Math.sin(animTime) * 0.3;
                    }
                }
            }

            app.flickeringLamps.forEach(lamp => {
                if (Math.random() > 0.985) {
                    lamp.light.intensity = 0;
                    lamp.bulbMat.color.setHex(0x111111);
                    if(Math.random() > 0.6) sfx.playFlicker();
                } else {
                    lamp.light.intensity = 1.2 + Math.random() * 0.2;
                    lamp.bulbMat.color.setHex(0xfff6e0);
                }
            });

            if(Math.random() > 0.95) app.alarmLight.intensity = Math.random() * 2.2;
            
            if (app.spookyDolls) {
                const px = app.camera.position.x;
                const pz = app.camera.position.z;
                app.spookyDolls.forEach(doll => {
                    if (doll.laughCooldown > 0) {
                        doll.laughCooldown -= dt;
                    } else {
                        const dist = Math.hypot(doll.x - px, doll.z - pz);
                        if (dist < 4.5 && app.player.hp > 0) {
                            sfx.playSpookyLaugh();
                            doll.laughCooldown = 15.0; 
                            showAlert("Чути дитячий сміх... Лялька поруч.");
                        }
                    }
                });
            }

            updateHUD(dt);
            app.renderer.render(app.scene, app.camera);
        }

        function updatePlayerPhysics(dt) {
            const p = app.player;
            let currentSpeed = p.speed;

            const joyY = app.touch && app.touch.delta ? app.touch.delta.y : 0;
            const isMoving = app.keys.w || app.keys.s || app.keys.a || app.keys.d || app.touch.joyActive;
            
            if (isMoving && p.isGrounded && !p.isHidden) {
                p.stepTimer += dt * (app.keys.shift ? 1.6 : 1.0);
                if (p.stepTimer >= 0.4) {
                    sfx.playStep(false);
                    p.stepTimer = 0;
                }
            }

            if ((app.keys.shift || joyY < -0.8) && p.stamina > 0 && p.isGrounded) {
                currentSpeed *= 1.6;
                p.stamina = Math.max(0, p.stamina - dt * 25);
            } else {
                p.stamina = Math.min(100, p.stamina + dt * 10);
            }

            let moveX = 0, moveZ = 0;
            if (app.keys.w) moveZ -= 1;
            if (app.keys.s) moveZ += 1;
            if (app.keys.a) moveX -= 1;
            if (app.keys.d) moveX += 1;

            if(app.isMobile && app.touch.joyActive) {
                moveX = app.touch.delta.x; moveZ = app.touch.delta.y;
            }

            const moveVec = new THREE.Vector3(moveX, 0, moveZ);
            if (moveVec.lengthSq() > 0) moveVec.normalize();
            moveVec.applyAxisAngle(new THREE.Vector3(0,1,0), app.camera.rotation.y);

            const nextPos = app.camera.position.clone();
            
            nextPos.x += moveVec.x * currentSpeed * dt;
            if(!isColliding(nextPos)) {
                app.camera.position.x = nextPos.x;
            } else {
                nextPos.x = app.camera.position.x; 
            }

            nextPos.z += moveVec.z * currentSpeed * dt;
            if(!isColliding(nextPos)) {
                app.camera.position.z = nextPos.z;
            }

            p.yVelocity -= 25 * dt; 
            app.camera.position.y += p.yVelocity * dt;

            if (app.camera.position.y <= p.height) {
                app.camera.position.y = p.height;
                p.yVelocity = 0;
                p.isGrounded = true;
            }

            if(p.battery > 0 && p.role !== 'Animatronic') {
                p.battery -= dt * 0.5; 
                app.player.light.intensity = p.battery < 10 && Math.random() > 0.5 ? 0 : 3;
            } else {
                app.player.light.intensity = 0; 
            }

            app.player.light.position.copy(app.camera.position);
            const targetVec = new THREE.Vector3(0, 0, -1).applyQuaternion(app.camera.quaternion);
            app.player.light.target.position.copy(app.camera.position).add(targetVec);

            const distToCenter = Math.hypot(app.camera.position.x, app.camera.position.z);
            if (distToCenter < 10 && p.role !== 'Animatronic') {
                p.battery = Math.min(60, p.battery + dt * 10);
                document.getElementById('recharge-icon').style.display = 'block';
            } else {
                document.getElementById('recharge-icon').style.display = 'none';
            }

            if (app.escapeOpen && app.camera.position.z < -50) {
                showAlert("ВИ УСПІШНО ВТЕКЛИ З ЛАБІРИНТУ!");
                setTimeout(() => location.reload(), 3000);
            }
        }

        function isColliding(pos) {
            const radius = 0.40; 
            const pBox = new THREE.Box3(
                new THREE.Vector3(pos.x - radius, 0, pos.z - radius),
                new THREE.Vector3(pos.x + radius, app.player.height + 0.2, pos.z + radius)
            );
            
            const wallCenter = new THREE.Vector3();
            for(let i = 0; i < app.walls.length; i++) {
                const wallBox = app.walls[i];
                wallBox.getCenter(wallCenter);
                if (pos.distanceToSquared(wallCenter) < 49) { 
                    if(wallBox.intersectsBox(pBox)) return true;
                }
            }
            return false;
        }

        function updateBotMonster(dt) {
            const bot = app.remotePlayers['bot'];
            if (!bot || !bot.mesh) return; 

            if(app.monster.stunTimer > 0) {
                app.monster.stunTimer -= dt; return;
            }

            const dist = bot.mesh.position.distanceTo(app.camera.position);

            if (dist < 1.8) {
                app.player.hp -= 50; 
                if(app.player.hp <= 0) {
                    executeJumpscare();
                } else {
                    showAlert("ВАС ВДАРИЛИ! ТІКАЙТЕ!");
                    sfx.playMonsterHit();
                    app.monster.stunTimer = 2.0; 
                }
                app.monster.state = 'idle'; 
                setTimeout(() => { if(app.player.hp > 0) app.monster.state = 'hunting'; }, 2000);
                return;
            }

            bot.mesh.lookAt(app.camera.position.x, bot.mesh.position.y, app.camera.position.z);
            const dir = new THREE.Vector3(); bot.mesh.getWorldDirection(dir);
            
            const next = bot.mesh.position.clone();
            next.x += dir.x * app.monster.speed * dt;
            
            const botBox = new THREE.Box3().setFromCenterAndSize(next, new THREE.Vector3(1.1, 2.2, 1.1));
            let blockedX = false, blockedZ = false;
            
            const botCenter = new THREE.Vector3();
            for(let w of app.walls) { 
                w.getCenter(botCenter);
                if(next.distanceToSquared(botCenter) < 49) {
                    if(w.intersectsBox(botBox)) { blockedX = true; break; } 
                }
            }
            if(!blockedX) bot.mesh.position.x = next.x;

            const nextZPos = new THREE.Vector3(bot.mesh.position.x, next.y, next.z + dir.z * app.monster.speed * dt);
            botBox.setFromCenterAndSize(nextZPos, new THREE.Vector3(1.1, 2.2, 1.1));
            
            for(let w of app.walls) { 
                w.getCenter(botCenter);
                if(nextZPos.distanceToSquared(botCenter) < 49) {
                    if(w.intersectsBox(botBox)) { blockedZ = true; break; } 
                }
            }
            if(!blockedZ) bot.mesh.position.z += dir.z * app.monster.speed * dt;

            if (bot.mesh.thighL) {
                const animTime = app.clock.getElapsedTime() * app.monster.speed * 1.8;
                bot.mesh.thighL.rotation.x = Math.sin(animTime) * 0.45;
                bot.mesh.thighR.rotation.x = -Math.sin(animTime) * 0.45;
                bot.mesh.upperArmL.rotation.x = -Math.sin(animTime) * 0.3;
                bot.mesh.upperArmR.rotation.x = Math.sin(animTime) * 0.3;
            }
        }

        function updateHUD(dt) {
            document.getElementById('bar-hp').style.width = app.player.hp + '%';
            document.getElementById('bar-stamina').style.width = app.player.stamina + '%';
            document.getElementById('bar-battery').style.width = (app.player.battery / 60 * 100) + '%';
            
            let currentRoleUa = app.player.role === 'Animatronic' ? 'Монстр (Аніматронік)' : (app.player.role === 'Engineer' ? 'Інженер' : (app.player.role === 'Hunter' ? 'Мисливець' : 'Медик'));
            document.getElementById('role-text').innerText = currentRoleUa;
            document.getElementById('gen-text').innerText = `ГЕНЕРАТОРИ: ${app.fixedGenerators} / 10`;

            if (app.player.cooldown > 0) {
                app.player.cooldown -= dt;
                document.getElementById('cooldown-text').innerText = `ЗДІБНІСТЬ КД: ${Math.ceil(app.player.cooldown)}c`;
            } else {
                document.getElementById('cooldown-text').innerText = 'ЗДІБНІСТЬ ГОТОВА [E]';
            }
        }

        function onWindowResize() {
            if(!app.camera || !app.renderer) return;
            app.camera.aspect = window.innerWidth / window.innerHeight;
            app.camera.updateProjectionMatrix();
            app.renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
